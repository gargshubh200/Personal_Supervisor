# ==============================================================================
# Personal Supervisor — Central Runtime Configuration
# ==============================================================================
# All "setup" data (toggles, search terms, locations, company target lists,
# career strategy constraints) lives here so it can be tuned WITHOUT touching
# any Python code. Loaded once via config_loader.py and imported by every
# MCP/SubAgent that needs it.
#
# NOT moved here (intentionally left in-code): regexes (title/YOE filters),
# LLM system prompts, and Google-Dork query strings — these encode engineering
# logic/behavior, not user-tunable setup data.
# ==============================================================================

# ------------------------------------------------------------------------------
# Which job-source MCPs run on each supervisor_agent.py pass. Flip to true/false
# to enable/disable a source without touching supervisor_agent.py.
# ambitionbox is disabled by default because the actor is still under-developed
# and is resource hungry
# ------------------------------------------------------------------------------
mcp_toggles:
  linkedin_hiring_posts: true
  ats_direct: true
  ats_google_dork: true
  linkedin_jobs: true
  indeed: true
  wellfound: true
  glassdoor: true
  ambitionbox: false

# ------------------------------------------------------------------------------
# Shared search terms / locations. A single canonical list is reused across
# supervisor_agent.py and every per-source MCP's function-default parameters
# (linkedin_job_scraper, indeed, wellfound, glassdoor, ambitionbox) — avoids
# maintaining 6 near-identical copies of the same lists.
# ------------------------------------------------------------------------------
search:
  master_search_queries:
    - "Data Platform Engineer"
    - "AI Platform Engineer"
    - "Software Engineer"
    - "AI Infrastructure Engineer"

  master_locations:
    - "India"
    - "Bengaluru"
    - "Remote"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"

  # Superset of master_locations used by the per-source scraper MCPs (Indeed,
  # Glassdoor, LinkedIn jobs, Wellfound, AmbitionBox) as their own function
  # defaults, for standalone/manual invocation outside supervisor_agent.py
  # (supervisor_agent.py always overrides with master_locations above).
  default_locations:
    - "India"
    - "Remote"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Delhi"
    - "Gurgaon"
    - "Noida"
    - "Gurugram"
    - "Mumbai"
    - "New Delhi"

  india_location_keywords:
    - "india"
    - "bengaluru"
    - "bangalore"
    - "hyderabad"
    - "pune"
    - "delhi"
    - "gurgaon"
    - "noida"
    - "gurugram"
    - "mumbai"
    - "new delhi"

  # Natural-language role terms used by linkedin_hiring_posts_mcp — what
  # hiring managers actually write in posts, not formal JD titles.
  hiring_post_roles:
    - "platform engineer"
    - "AI engineer"
    - "software engineer"
    - "data engineer"

# ------------------------------------------------------------------------------
# Career Strategy Constraints — Agent Optimization Context, Section 6.
# Hard reject constraints MUST override an APPLY decision. Preference
# boost/downgrade lists are passed to the Application Strategy Agent LLM to
# adjust priority tier only (never the underlying decision).
# ------------------------------------------------------------------------------
